bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "~/.config/tmux/scripts/clip-copy.sh"
bind P run-shell "~/.config/tmux/scripts/clip-paste.sh | tmux load-buffer - && tmux paste-buffer"

# Windows-style mouse behavior: right-click copies a selection or pastes.
unbind -T copy-mode-vi MouseDragEnd1Pane
bind -T copy-mode-vi MouseDown3Pane send -X copy-pipe-and-cancel "~/.config/tmux/scripts/clip-copy.sh"
bind -T root MouseDown3Pane select-pane -t = \; run-shell "~/.config/tmux/scripts/clip-paste.sh | tmux load-buffer - && tmux paste-buffer -t '#{mouse_pane}'"
